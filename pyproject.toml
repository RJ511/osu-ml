[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osuml"
version = "0.2.0"
description = "osu! ML Skill & Recommendation System: collector, catalogo de mapas, modelos de alcancabilidade e recomendador de mapas"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
postgres = ["psycopg[binary]>=3.1"]
difficulty = ["rosu-pp-py>=4.0"]
s3 = ["boto3>=1.34"]
ml = ["lightgbm>=4.0", "numpy>=1.26", "scipy>=1.11"]
recommend = ["lightgbm>=4.0", "numpy>=1.26", "scipy>=1.11", "pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
osuml = "osuml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
